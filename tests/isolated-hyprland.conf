# Test instance only. No user config, autostart, key bindings, or system changes.
monitor = , 2560x1440@60, 0x0, 1
input {
    sensitivity = -0.35
    force_no_accel = false
    follow_mouse = 0
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
debug {
    disable_logs = false
    # The parent tiles the nested window to arbitrary pixel dimensions. Permit
    # fractional test scale there; this is not a physical output configuration.
    disable_scale_checks = true
}
